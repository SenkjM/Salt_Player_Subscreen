name: Build

# 只做编译验证：把插件挂到 spw-workshop-api 的 Gradle 构建里，编译并打包出 .spmod，不做发布。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout spw-workshop-api
        uses: actions/checkout@v4
        with:
          repository: Moriafly/spw-workshop-api
          path: API_referer
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # 插件仓库没有自己的 Gradle 构建，需要作为子项目挂到 API 仓库里。
      - name: Mount plugin into API build
        run: |
          set -euo pipefail
          mkdir -p API_referer/Salt_Player_Subscreen
          cp -R src API_referer/Salt_Player_Subscreen/src
          cp build.gradle.kts API_referer/Salt_Player_Subscreen/
          printf '\ninclude(":Salt_Player_Subscreen")\n' >> API_referer/settings.gradle.kts
          grep -q 'include(":Salt_Player_Subscreen")' API_referer/settings.gradle.kts
          chmod +x API_referer/gradlew

      - name: Compile and package .spmod
        working-directory: API_referer
        run: ./gradlew :Salt_Player_Subscreen:plugin --console=plain --no-daemon

      - name: Upload .spmod
        uses: actions/upload-artifact@v4
        with:
          name: Salt_Player_Subscreen-spmod
          path: API_referer/Salt_Player_Subscreen/build/libs/*.spmod
          if-no-files-found: error
